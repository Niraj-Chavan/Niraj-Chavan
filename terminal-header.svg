<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Consolas, monospace">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#1c2330"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- window -->
  <rect x="4" y="4" width="752" height="352" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="4" y="4" width="752" height="44" rx="14" fill="url(#bar)"/>
  <rect x="4" y="32" width="752" height="16" fill="url(#bar)"/>
  <line x1="4" y1="48" x2="756" y2="48" stroke="#30363d" stroke-width="1"/>
  <circle cx="32" cy="26" r="7" fill="#ff5f57"/>
  <circle cx="56" cy="26" r="7" fill="#febc2e"/>
  <circle cx="80" cy="26" r="7" fill="#28c840"/>
  <text x="380" y="31" text-anchor="middle" font-size="14" fill="#8b949e">niraj@vit: ~</text>

  <!-- body -->
  <g font-size="16">
    <!-- L1 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.06;1" dur="14s" repeatCount="indefinite"/>
      <text x="30" y="90" fill="#58a6ff">$</text>
      <text x="48" y="90" fill="#e6edf3">whoami</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.09;0.11;1" dur="14s" repeatCount="indefinite"/>
      <text x="30" y="116" fill="#7ee787">Niraj Chavan</text>
      <text x="150" y="116" fill="#8b949e">— CSE @ VIT Pune · CGPA 9.09</text>
    </g>
    <!-- L2 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.20;0.22;1" dur="14s" repeatCount="indefinite"/>
      <text x="30" y="152" fill="#58a6ff">$</text>
      <text x="48" y="152" fill="#e6edf3">cat focus.txt</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.27;0.29;1" dur="14s" repeatCount="indefinite"/>
      <text x="30" y="178" fill="#79c0ff">federated-learning · computer-vision · C++ algorithms</text>
    </g>
    <!-- L3 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.40;1" dur="14s" repeatCount="indefinite"/>
      <text x="30" y="214" fill="#58a6ff">$</text>
      <text x="48" y="214" fill="#e6edf3">leetcode --stats</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.47;1" dur="14s" repeatCount="indefinite"/>
      <text x="30" y="240" fill="#ffa657">752 solved</text>
      <text x="140" y="240" fill="#8b949e">(306E / 386M / 60H) · CodeChef 1572</text>
    </g>
    <!-- L4 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.56;0.58;1" dur="14s" repeatCount="indefinite"/>
      <text x="30" y="276" fill="#58a6ff">$</text>
      <text x="48" y="276" fill="#e6edf3">./seek --role SDE-intern</text>
    </g>
    <g opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.63;0.65;1" dur="14s" repeatCount="indefinite"/>
      <text x="30" y="302" fill="#7ee787">▸ status: OPEN to internships</text>
    </g>
    <!-- prompt + blinking cursor -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.70;0.72;1" dur="14s" repeatCount="indefinite"/>
      <text x="30" y="332" fill="#58a6ff">$</text>
      <rect x="48" y="318" width="10" height="18" fill="#58a6ff">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
